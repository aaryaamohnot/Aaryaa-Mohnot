<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Feels</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #b8d4f0;
      --sky-dark: #1a2f4a;
      --card-bg: rgba(255,255,255,0.18);
      --card-border: rgba(255,255,255,0.35);
      --text: #0f1e30;
      --muted: #3a5068;
      --accent: #e85d26;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #c9dff5 0%, #a8c8ee 40%, #7fafd6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* animated clouds */
    .clouds {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.55);
      border-radius: 60px;
      filter: blur(8px);
      animation: drift linear infinite;
    }
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
      top: -40%;
      left: 20%;
      width: 50%;
      height: 80%;
    }
    .c1 { width: 200px; height: 60px; top: 8%; animation-duration: 60s; animation-delay: 0s; }
    .c2 { width: 140px; height: 44px; top: 18%; animation-duration: 80s; animation-delay: -20s; opacity: 0.7; }
    .c3 { width: 260px; height: 70px; top: 5%; animation-duration: 100s; animation-delay: -40s; opacity: 0.5; }

    @keyframes drift {
      from { transform: translateX(-300px); }
      to   { transform: translateX(110vw); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.6rem;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-weight: 300;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }
    .search-row input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--card-border);
      background: rgba(255,255,255,0.55);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      backdrop-filter: blur(8px);
      transition: border 0.2s, box-shadow 0.2s;
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,93,38,0.15);
    }
    .search-row button {
      padding: 14px 22px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .search-row button:hover { background: #c94e1c; transform: scale(1.03); }
    .search-row button:active { transform: scale(0.97); }

    /* main card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      padding: 32px;
      display: none;
      animation: fadeUp 0.4s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .city-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.9rem;
      color: var(--text);
      margin-bottom: 4px;
    }
    .description {
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: capitalize;
      margin-bottom: 24px;
    }

    .temp-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 28px;
    }
    .actual-temp {
      font-family: 'DM Serif Display', serif;
      font-size: 5rem;
      color: var(--text);
      line-height: 1;
    }
    .feels-block {
      padding-bottom: 8px;
    }
    .feels-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .feels-temp {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      color: var(--accent);
      line-height: 1;
    }
    .feels-diff {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .stat {
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
    }
    .stat-icon { font-size: 1.5rem; margin-bottom: 6px; }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-sub {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
      margin-top: 3px;
    }

    .error {
      background: rgba(255,100,80,0.15);
      border: 1px solid rgba(255,100,80,0.3);
      border-radius: 14px;
      padding: 16px 20px;
      color: #8b2000;
      font-size: 0.9rem;
      display: none;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 24px;
      display: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="clouds">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div class="wrapper">
    <h1>Weather Feels</h1>
    <p class="tagline">What the weather actually feels like — not just the number.</p>

    <div class="search-row">
      <input type="text" id="cityInput" placeholder="Enter a city..." />
      <button onclick="fetchWeather()">Check</button>
    </div>

    <div class="loading" id="loading">Looking outside...</div>
    <div class="error" id="error">City not found. Try another name.</div>

    <div class="card" id="card">
      <div class="city-name" id="cityName"></div>
      <div class="description" id="description"></div>

      <div class="temp-row">
        <div class="actual-temp"><span id="actualTemp"></span>°</div>
        <div class="feels-block">
          <div class="feels-label">Feels like</div>
          <div class="feels-temp"><span id="feelsTemp"></span>°</div>
          <div class="feels-diff" id="feelsDiff"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-icon">💨</div>
          <div class="stat-value"><span id="windSpeed"></span> mph</div>
          <div class="stat-label">Wind</div>
          <div class="stat-sub" id="windLabel"></div>
        </div>
        <div class="stat">
          <div class="stat-icon">☀️</div>
          <div class="stat-value"><span id="cloudCover"></span>%</div>
          <div class="stat-label">Cloud cover</div>
          <div class="stat-sub" id="sunLabel"></div>
        </div>
        <div class="stat">
          <div class="stat-icon">💧</div>
          <div class="stat-value"><span id="humidity"></span>%</div>
          <div class="stat-label">Humidity</div>
          <div class="stat-sub" id="humidityLabel"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('cityInput');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') fetchWeather(); });

    async function fetchWeather() {
      const city = input.value.trim();
      if (!city) return;

      document.getElementById('card').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const res = await fetch(`/weather?city=${encodeURIComponent(city)}`);
        const data = await res.json();
        document.getElementById('loading').style.display = 'none';

        if (data.error) {
          document.getElementById('error').style.display = 'block';
          return;
        }

        document.getElementById('cityName').textContent = `${data.city}, ${data.country}`;
        document.getElementById('description').textContent = data.description;
        document.getElementById('actualTemp').textContent = data.temp;
        document.getElementById('feelsTemp').textContent = data.feels_like;

        const diff = data.diff;
        const diffText = diff === 0 ? 'Same as actual' : diff > 0 ? `+${diff}° warmer than shown` : `${diff}° colder than shown`;
        document.getElementById('feelsDiff').textContent = diffText;

        document.getElementById('windSpeed').textContent = data.wind_speed;
        document.getElementById('windLabel').textContent = data.wind_label;
        document.getElementById('cloudCover').textContent = data.cloud_cover;
        document.getElementById('sunLabel').textContent = data.sun_label;
        document.getElementById('humidity').textContent = data.humidity;
        document.getElementById('humidityLabel').textContent = data.humidity_label;

        const card = document.getElementById('card');
        card.style.display = 'block';
        card.style.animation = 'none';
        void card.offsetWidth;
        card.style.animation = 'fadeUp 0.4s ease forwards';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
